<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5ead8">
    <title>DS - Seu nome</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="flow-screen nickname-screen">
      <img class="flow-logo" src="img/logo.png" alt="Logo do DS">
      <h1 class="flow-title nickname-title">Como quer<br>ser chamado(a) ?</h1>

      <form class="nickname-form" id="nickname-form">
        <label for="nickname">Nome / Apelido</label>
        <input id="nickname" name="nickname" type="text" placeholder="Seu nome" autocomplete="nickname" required>
        <button class="flow-primary" type="submit">Próximo</button>
      </form>
    </main>
  </body>
</html>
